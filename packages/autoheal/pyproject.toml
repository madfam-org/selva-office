[project]
name = "selva-autoheal"
version = "0.1.0"
description = "Infra self-healing agents, v1: alert intake, read-only diagnosis under a per-incident budget, remedy proposals for human approval (RFC 0047)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.5",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selva_autoheal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
