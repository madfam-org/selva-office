apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: selva
  labels:
    app.kubernetes.io/name: workers
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workers
        app.kubernetes.io/part-of: selva-office
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: selva-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workers
          image: ghcr.io/madfam-org/selva-workers@sha256:7536d8c7fefad9b815381c8dc0aca57df4e609eb10ae05ad69eda4eb9600bb5b
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["true"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["true"]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: selva-config
          env:
            - name: ENVIRONMENT
              value: production
            # Key 1 of 2 for the credit autopilot; key 2 is `autopilot: true`
            # on the provider grant in Vault. Idle unless both are set.
            - name: CREDIT_AUTOPILOT_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: secret-key
            - name: PHYND_CRM_URL
              value: http://phynd-crm-web.phynd-crm.svc.cluster.local
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: COLYSEUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: colyseus-secret
            - name: WORKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: WORKER_API_TOKEN
            # CONSENT_LEDGER_SIGNING_SECRET added 2026-05-04 — Settings()
            # validator (v2.3.0) refuses startup with the dev-default
            # sentinel in production. Bootstrap key was generated and
            # stored in selva-secrets at the same time.
            - name: CONSENT_LEDGER_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: CONSENT_LEDGER_SIGNING_SECRET
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            - name: MEMORY_PERSIST_DIR
              value: /data/selva/memory
            - name: BANDIT_PERSIST_PATH
              value: /data/selva/bandit.json
            - name: DHANAM_API_URL
              value: "https://api.dhan.am"
            - name: ENCLII_API_URL
              value: "https://api.enclii.dev"
            - name: ENCLII_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: ENCLII_API_TOKEN
                  optional: true
            - name: PORKBUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: PORKBUN_API_KEY
                  optional: true
            - name: PORKBUN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: PORKBUN_SECRET_KEY
                  optional: true
            - name: YANTRA4D_API_URL
              value: "https://api.yantra4d.com"
            - name: COTIZA_API_URL
              value: "https://api.cotiza.studio"
            - name: PRAVARA_MES_API_URL
              value: "https://mes-api.madfam.io"
            - name: SELVA_COUPLER_TOOLS_ENABLED
              value: "true"
            - name: COUPLER_BASE_URL
              value: "https://coupler-api.madfam.io"
            - name: ORG_CONFIG_PATH
              value: "/etc/selva/org-config.yaml"
            # Provider credit grants (docs/PROVIDER_CREDIT_GRANTS.md). The key
            # is the existing selva-llm-secrets entry (provisioned outside this
            # repo, like DEEPINFRA_API_KEY); the grant file comes from
            # selva-provider-grants (Vault secret/selva, optional until seeded).
            # Mounting the key is safe on its own: REQUIRED_FOR makes Anthropic
            # usable ONLY under a valid, unexpired, unexhausted grant for the
            # caller's org — with no grant file it stays unusable (fail closed).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: PROVIDER_GRANTS_PATH
              value: "/etc/selva/provider-grants/provider-grants.json"
            - name: PROVIDER_GRANTS_REQUIRED_FOR
              value: "anthropic"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: selva-memory
              mountPath: /data/selva
            - name: org-config
              mountPath: /etc/selva
              readOnly: true
            - name: provider-grants
              mountPath: /etc/selva/provider-grants
              readOnly: true
            # RFC 0005 Sprint 1a — projected SA token for the
            # write_kubernetes_secret tool. Bound to a dedicated SA
            # with narrow (create/update/patch only) RBAC. See
            # selva-secret-writer-sa.yaml and
            # selva-secret-writer-rolebinding.yaml.
            - name: selva-secret-writer-token
              mountPath: /var/run/secrets/selva/secret-writer
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: selva-memory
          persistentVolumeClaim:
            claimName: selva-memory-pvc
        - name: org-config
          configMap:
            name: selva-org-config
        - name: provider-grants
          secret:
            secretName: selva-provider-grants
            optional: true
            items:
              - key: provider-grants.json
                path: provider-grants.json
        # Projected token tied to the selva-secret-writer SA. Expires
        # hourly via TokenRequest API auto-rotation. The tool falls
        # back to in-cluster default SA config if this mount is absent
        # (local dev / tests).
        - name: selva-secret-writer-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: kubernetes.default.svc
                  expirationSeconds: 3600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: selva-memory-pvc
  namespace: selva
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
