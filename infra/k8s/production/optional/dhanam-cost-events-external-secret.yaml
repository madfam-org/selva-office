# NOT LISTED in ../kustomization.yaml on purpose (like optional/ollama.yaml).
#
# The Janua client_credentials pair Selva's cost-events sweep
# (cost-events-cronjob.yaml) uses to push cost.event.v1 events into Dhanam:
# enclii platform `selva-dhanam-cost-events` (audience dhanam-api, scope
# dhanam-cost-events:write, org-bound), filed by
# `enclii secrets provision oidc --platform selva-dhanam-cost-events` into Vault
# KV `secret/selva` as two LOWERCASE properties (intake target
# selva/dhanam-cost-events-client). Its own ExternalSecret: ESO is
# all-or-nothing per ExternalSecret, so an unprovisioned pair never holds
# another Selva Secret.
#
# Listing it before the properties exist parks it in SecretSyncError, which
# Argo reports as Degraded. List it in ../kustomization.yaml in the same PR
# that follows the provisioning (docs/COST_EVENTS.md § Turning it on).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-dhanam-cost-events
  namespace: selva
  labels:
    app.kubernetes.io/name: dhanam-cost-events
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-dhanam-cost-events
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SELVA_DHANAM_COST_EVENTS_CLIENT_ID
      remoteRef:
        key: secret/selva
        property: dhanam_cost_events_client_id
    - secretKey: SELVA_DHANAM_COST_EVENTS_CLIENT_SECRET
      remoteRef:
        key: secret/selva
        property: dhanam_cost_events_client_secret
