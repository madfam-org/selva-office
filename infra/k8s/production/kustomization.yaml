apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: selva

  # RFC 0005 Sprint 1a — dedicated SA in the `selva` namespace.
  # The per-target-namespace Roles + RoleBindings live in
  # selva-secret-writer-rolebinding.yaml and are applied OUTSIDE this
  # kustomize bundle (kustomize's namespace: selva would rewrite
  # them incorrectly). See that file's header for the ops procedure.
# Cross-path read of phynd's HMAC/bearer values (secret/phynd-crm already
# exists), so selva signs exactly what phynd verifies. Consumer mounts in
# nexus-api are optional:true; safe to include pre-consumer.
# ollama.yaml — DELIBERADAMENTE NO LISTADO. Vive en optional/ollama.yaml.
#
# El Deployment de Ollama fue bloqueado en admisión por la ClusterPolicy
# de Kyverno `restrict-image-registries` (Enforce), lo que dejó la app
# `selva-services` OutOfSync y bloqueó el resto del sync:
#
#   resource Deployment/selva/ollama was blocked due to the following
#   policies — restrict-image-registries: Images must come from approved
#   registries
#
# La política compara PREFIJOS LITERALES de registro; `ollama/ollama:…`
# (nombre corto de Docker Hub) no empata con `docker.io/*` aunque el
# runtime lo resuelva al mismo lugar. El manifiesto ya quedó corregido a
# `ghcr.io/madfam-org/ollama:0.5.7`, pero ESE MIRROR AÚN NO EXISTE.
#
# Para volver a listarlo aquí hacen falta, en orden:
#   1. Espejar la imagen al registro aprobado (ver
#      the restricted-tier operator runbook (private operations repo) § 1. Espejar la imagen de Ollama).
#   2. Verificar que el mirror se puede jalar desde el cluster.
#   3. Re-agregar `- optional/ollama.yaml` a esta lista.
# Hasta entonces `restricted`/`confidential` siguen fallando cerrado con
# 503 `local_backend_unavailable`, que es el comportamiento correcto.
# Provider credit grants + grant-funded Anthropic key (secret/selva). Parks in
# SecretSyncError until the Vault properties exist; consumers are optional.
resources:
- configmap.yaml
- org-config.yaml
- tenant-policies.yaml
- service-account.yaml
- migrate-job.yaml
- nexus-api.yaml
- inference-gateway.yaml
- office-ui.yaml
- colyseus.yaml
- admin.yaml
- gateway.yaml
- workers.yaml
- service-monitors.yaml
- pdb.yaml
- hpa.yaml
- backup-cronjob.yaml
- keda-scaledobject.yaml
- keda-trigger-auth.yaml
- selva-secret-writer-sa.yaml
- phynd-external-secret.yaml
- provider-grants-external-secret.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: selva-office

# Image digest pins per RFC 0017 + 2026-05-03 ecosystem-health audit
# (Kyverno fail-closed mutable-tag policy). Each deployment manifest
# (admin.yaml, colyseus.yaml, gateway.yaml, nexus-api.yaml, office-ui.yaml)
# still references `:latest` inline; kustomize rewrites these to
# digest-pinned references at build time. Workers is pinned inline in
# workers.yaml and is also listed here so digest automation can update
# the rebranded `selva-workers` image.
#
# Digests sourced from the most recent successful Build job logs in
# `.github/workflows/deploy.yml` runs (the `pushing manifest for
# <image>:latest@sha256:…` line). One per image:
#
#   nexus-api : run 24940442724 / 2026-04-25T20:54Z (commit fdd5a85)
#   office-ui : run 24480880306 / 2026-04-15T22:09Z
#   colyseus  : run 24879593455 / 2026-04-24T08:18Z
#   admin     : run 24616588100 / 2026-04-18T23:48Z
#   gateway   : live ready ReplicaSet gateway-85fc69c6b6 / 2026-05-04
#
# Older office-ui digests reflect change-detection skipping its builds
# for unrelated commits. Gateway is pinned to the most recent digest
# observed in a ready production ReplicaSet after the newer audit-derived
# digest failed to pull.
images:
- digest: sha256:f5fbc90d553856041066a06110b3df787cf9aa4c737b9c20dd208ad6f87c266a
  name: ghcr.io/madfam-org/selva-admin
  newName: ghcr.io/madfam-org/selva-admin
- digest: sha256:c2f17d3a58bfcde1f96cf7ed96bf317e869dc04b1cab8d523df426620a1e5e68
  name: ghcr.io/madfam-org/selva-colyseus
  newName: ghcr.io/madfam-org/selva-colyseus
- digest: sha256:619513470ef2b38b6f906e76c1ce618f8332b998061a5a28cfaf9f07a8dda6af
  name: ghcr.io/madfam-org/selva-gateway
  newName: ghcr.io/madfam-org/selva-gateway
- digest: sha256:5e56b1dfca11df77de31a0cb1098650ac6ba1ec22d73193b3d0c6e6d5fc6acda
  name: ghcr.io/madfam-org/selva-inference-gateway
  newName: ghcr.io/madfam-org/selva-inference-gateway
- digest: sha256:77190eb3e6d9aaa030e1c567f75b8213bdac6936ce0504ac72aa5ba53405d44d
