apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: selva
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-api
        app.kubernetes.io/part-of: selva-office
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: selva-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-api
          image: ghcr.io/madfam-org/selva-nexus-api@sha256:122e8f65c01be96f76b6ade80244bfb228070a5bbfa98c285ebd99a78c285c26
          ports:
            - containerPort: 4300
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health/health
              port: 4300
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/health
              port: 4300
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: selva-config
          env:
            - name: ENVIRONMENT
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: secret-key
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: RESEND_API_KEY
            - name: WORKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: WORKER_API_TOKEN
            # CONSENT_LEDGER_SIGNING_SECRET added 2026-05-04 — Settings()
            # validator (v2.3.0) refuses startup with the dev-default
            # sentinel in production. Bootstrap key was generated and
            # stored in selva-secrets at the same time.
            - name: CONSENT_LEDGER_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: CONSENT_LEDGER_SIGNING_SECRET
            - name: DHANAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: DHANAM_WEBHOOK_SECRET
            - name: DHANAM_CATALOG_APPLY_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: DHANAM_CATALOG_APPLY_SECRET
            - name: COLYSEUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: colyseus-secret
            - name: BILLING_VIA_DHANAM
              value: "true"
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            - name: TULANA_API_URL
              value: "https://tulana-api.madfam.io"
            - name: TULANA_SELVA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: TULANA_SELVA_WEBHOOK_SECRET
            - name: ORG_CONFIG_PATH
              value: "/etc/selva/org-config.yaml"
            # Provider credit grants (docs/PROVIDER_CREDIT_GRANTS.md). The key
            # is the existing selva-llm-secrets entry (provisioned outside this
            # repo, like DEEPINFRA_API_KEY); the grant file comes from
            # selva-provider-grants (Vault secret/selva, optional until seeded).
            # Mounting the key is safe on its own: REQUIRED_FOR makes Anthropic
            # usable ONLY under a valid, unexpired, unexhausted grant for the
            # caller's org — with no grant file it stays unusable (fail closed).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: PROVIDER_GRANTS_PATH
              value: "/etc/selva/provider-grants/provider-grants.json"
            - name: PROVIDER_GRANTS_REQUIRED_FOR
              value: "anthropic"
          workingDir: /data
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: org-config
              mountPath: /etc/selva
              readOnly: true
            - name: provider-grants
              mountPath: /etc/selva/provider-grants
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: org-config
          configMap:
            name: selva-org-config
        - name: provider-grants
          secret:
            secretName: selva-provider-grants
            optional: true
            items:
              - key: provider-grants.json
                path: provider-grants.json
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: selva
  labels:
    app.kubernetes.io/name: nexus-api
    app.kubernetes.io/part-of: selva-office
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexus-api
  ports:
    # Named so ServiceMonitor/selva-nexus-api (service-monitors.yaml, `port: http`)
    # resolves an endpoint: the operator matches endpoints to Service ports by
    # NAME only. Unnamed, the monitor matched zero targets.
    - name: http
      port: 80
      targetPort: 4300
      protocol: TCP
