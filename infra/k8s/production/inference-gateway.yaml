# RFC 0034 P2 — the OpenAI-compatible /v1 inference proxy extracted from
# nexus-api into its own deployable. Same code (inference_proxy router), same
# auth, same USD usage ledger; separate process so the LLM chokepoint's uptime
# is independent of monolith deploys.
#
# Env mirrors nexus-api: the gateway imports the same Settings, whose
# production validators refuse startup unless SECRET_KEY, WORKER_API_TOKEN,
# CONSENT_LEDGER_SIGNING_SECRET, and COLYSEUS_SECRET are real (even though the
# gateway itself never uses Colyseus). REDIS_URL is mounted optional and read
# only by the provider credit-grant meter (fail-closed per guarded provider);
# the settings come from selva-config like nexus-api so provider config stays
# identical.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: selva
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/component: api
spec:
  # 1 replica while both nodes sit at 99% CPU *requests* (not usage) — the
  # dual-run means nexus-api still serves /v1. Scale to 2 after the cluster
  # request right-sizing lands.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
        app.kubernetes.io/part-of: selva-office
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: selva-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-gateway
          image: ghcr.io/madfam-org/selva-inference-gateway:latest
          ports:
            - containerPort: 4306
              protocol: TCP
          resources:
            requests:
              # 10m: the proxy is I/O-bound (upstream LLM calls); it idles at
              # single-digit millicores. Both nodes are ~99% CPU-requested, so
              # a 50m ask cannot schedule; limits (500m) are what matter.
              cpu: 10m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4306
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4306
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: selva-config
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "4306"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: secret-key
            - name: WORKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: WORKER_API_TOKEN
            - name: CONSENT_LEDGER_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: CONSENT_LEDGER_SIGNING_SECRET
            - name: COLYSEUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: colyseus-secret
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: DEEPINFRA_API_KEY
                  optional: true
            - name: ORG_CONFIG_PATH
              value: "/etc/selva/org-config.yaml"
            # Read ONLY by the provider credit-grant meter. Optional: without
            # it grant-guarded providers fail closed; nothing else here uses
            # Redis, so a Redis outage still cannot take the gateway down.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: selva-secrets
                  key: redis-url
                  optional: true
            # Provider credit grants (docs/PROVIDER_CREDIT_GRANTS.md). The key
            # is the existing selva-llm-secrets entry (provisioned outside this
            # repo, like DEEPINFRA_API_KEY); the grant file comes from
            # selva-provider-grants (Vault secret/selva, optional until seeded).
            # Mounting the key is safe on its own: REQUIRED_FOR makes Anthropic
            # usable ONLY under a valid, unexpired, unexhausted grant for the
            # caller's org — with no grant file it stays unusable (fail closed).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            # Second Anthropic account, registered as its own provider
            # `anthropic-ops` (org-config `providers`, native adapter). Same
            # fail-closed rule: listed in REQUIRED_FOR below, so it spends ONLY
            # under its own grant (provider "anthropic-ops"); absent key ⇒ the
            # provider is simply not registered. docs/PROVIDER_CREDIT_GRANTS.md.
            - name: ANTHROPIC_API_KEY_OPS
              valueFrom:
                secretKeyRef:
                  name: selva-llm-secrets
                  key: ANTHROPIC_API_KEY_OPS
                  optional: true
            - name: PROVIDER_GRANTS_PATH
              value: "/etc/selva/provider-grants/provider-grants.json"
            - name: PROVIDER_GRANTS_REQUIRED_FOR
              value: "anthropic,anthropic-ops"
            # Per-tenant floors, caps, and rate limits (tenant-policies.yaml).
            # Absent file ⇒ no floors in force; the startup log says which
            # tenants loaded. See the restricted-tier operator runbook (private operations repo).
            - name: TENANT_POLICY_PATH
              value: "/etc/selva/tenant-policies/tenant-policies.yaml"
            # The local backend that serves restricted/confidential data.
            # Without this the factory default (http://localhost:11434)
            # points at nothing inside this pod and every regulated call
            # 503s. Optional so the gateway still boots (and still fails
            # closed) before the Ollama bundle is applied.
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selva-ollama-config
                  key: OLLAMA_BASE_URL
                  optional: true
          workingDir: /data
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: org-config
              mountPath: /etc/selva
              readOnly: true
            - name: tenant-policies
              mountPath: /etc/selva/tenant-policies
              readOnly: true
            - name: provider-grants
              mountPath: /etc/selva/provider-grants
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: org-config
          configMap:
            name: selva-org-config
        - name: tenant-policies
          configMap:
            name: selva-tenant-policies
            optional: true
        - name: provider-grants
          secret:
            secretName: selva-provider-grants
            optional: true
            items:
              - key: provider-grants.json
                path: provider-grants.json
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: selva
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: selva-office
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inference-gateway
  ports:
    - port: 80
      targetPort: 4306
      protocol: TCP
