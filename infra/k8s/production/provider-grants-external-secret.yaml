# Provider credit grants file (contract C1, docs/PROVIDER_CREDIT_GRANTS.md).
#
# Vault KV `secret/selva` (custody decision 2026-06-16), one property:
#   provider_grants_json  → file /etc/selva/provider-grants/provider-grants.json
#                            (PROVIDER_GRANTS_PATH)
# The grant declaration (amount, window, orgs) lives ONLY in Vault — this repo
# is public. The Anthropic key itself is NOT synced here: consumers read the
# existing `selva-llm-secrets` / ANTHROPIC_API_KEY (provisioned outside this
# repo, same as DEEPINFRA_API_KEY).
#
# Safe to merge before the property exists: until it is seeded this ES parks
# in SecretSyncError, the Secret `selva-provider-grants` is never created, and
# every consumer mounts it optional:true — pods start as today. With no grant
# file, PROVIDER_GRANTS_REQUIRED_FOR=anthropic keeps Anthropic unusable even
# though its key is mounted.
#
# deletionPolicy Delete (the other ESs here use Retain): removing the Vault
# property deletes the Secret, the grants file disappears from the pods within
# ~1–2 min, and Anthropic becomes unusable again (fail closed) — a kill switch
# without a restart. Delete only fires when the provider reports the data
# gone, never on a transient Vault/ESO error.
#
# Pickup: the file is a whole-directory Secret volume (no subPath), so kubelet
# refreshes it in place and the loader re-reads it within ~60 s. The volume is
# optional, though: a pod started BEFORE the Secret existed has no mount to
# refresh — run a rollout restart of inference-gateway, nexus-api and workers
# after the first sync. No reloader runs in this cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-provider-grants
  namespace: selva
  labels:
    app.kubernetes.io/name: provider-grants
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-provider-grants
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: provider-grants.json
      remoteRef:
        key: secret/selva
        property: provider_grants_json
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
