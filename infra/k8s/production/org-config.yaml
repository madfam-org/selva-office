apiVersion: v1
kind: ConfigMap
metadata:
  name: selva-org-config
  namespace: selva
  labels:
    app.kubernetes.io/name: org-config
    app.kubernetes.io/part-of: selva-office
data:
  org-config.yaml: |
    # ═══════════════════════════════════════════════════════════════════════
    # MADFAM Production Org Config
    # ═══════════════════════════════════════════════════════════════════════
    # Deployed via ConfigMap → mounted at /etc/selva/org-config.yaml.
    # Providers are auto-registered from env vars (DEEPINFRA_API_KEY, etc.)
    # — only add here if overriding base_url or timeout, or to declare an
    # extra account of a vendor (below).
    # ═══════════════════════════════════════════════════════════════════════

    providers:
      # Second Anthropic account as its own provider (native Anthropic
      # adapter). Registered only when ANTHROPIC_API_KEY_OPS is mounted AND
      # `anthropic-ops` is in PROVIDER_GRANTS_REQUIRED_FOR; it then spends
      # only under a grant whose provider is `anthropic-ops`. It is in NO
      # priority list and NO assignment: only a server-set provider_allowlist
      # (madfam infra ops / self-healing) reaches it. A third account is
      # another entry like this one plus its key, REQUIRED_FOR entry and grant.
      anthropic-ops:
        adapter: anthropic
        api_key_env: ANTHROPIC_API_KEY_OPS

    # ── Task-type model assignments ───────────────────────────────────────
    # DeepInfra is the only provider with active credits right now, so all
    # chat/completion and embedding task types are pinned there. When another
    # provider has funded capacity again, widen the priority lists first.
    model_assignments:
      planning:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 8192
        temperature: 0.6
      coding:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 8192
        temperature: 0.4
      fast_coding:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 4096
        temperature: 0.3
      review:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 4096
        temperature: 0.5
      research:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 8192
        temperature: 0.7
      crm:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 4096
        temperature: 0.7
      support:
        provider: deepinfra
        model: meta-llama/Llama-3.3-70B-Instruct
        max_tokens: 2048
        temperature: 0.7
      vision:
        provider: deepinfra
        model: meta-llama/Llama-3.2-90B-Vision-Instruct
        max_tokens: 4096
        temperature: 0.5
      embedding:
        provider: deepinfra
        model: BAAI/bge-base-en-v1.5
        max_tokens: 512
        temperature: 0.0

    # ── Priority lists ────────────────────────────────────────────────────
    cloud_priority:
      - deepinfra

    cheapest_priority:
      - deepinfra

    # ── Per-org overrides ─────────────────────────────────────────────────
    # ONLY the named org (or an alias) routes differently; every other tenant
    # uses the global assignments + priority lists above, unchanged.
    # madfam = Selva's own tenant (PLATFORM_ORG_ID). Its Anthropic routes are
    # usable only under a provider credit grant (PROVIDER_GRANTS_* — see the
    # grants loader): without a valid grant for this org, or without
    # ANTHROPIC_API_KEY mounted, Anthropic is unavailable for the call and
    # the request falls back to the global DeepInfra assignment for the same
    # task type. Add the org's Janua org UUID under `aliases` so tasks
    # dispatched with a Janua token (org_id = the Janua org UUID) match too.
    org_overrides:
      madfam:
        aliases: []
        # deepinfra first: untyped requests keep today's default provider;
        # only the task types assigned below go to Anthropic.
        cloud_priority:
          - deepinfra
          - anthropic
        cheapest_priority:
          - deepinfra
          - anthropic
        model_assignments:
          planning:
            provider: anthropic
            model: claude-opus-5-5
            max_tokens: 8192
          coding:
            provider: anthropic
            model: claude-opus-5-5
            max_tokens: 8192
          review:
            provider: anthropic
            model: claude-opus-5-5
            max_tokens: 4096
          research:
            provider: anthropic
            model: claude-opus-5-5
            max_tokens: 8192
          fast_coding:
            provider: anthropic
            model: claude-sonnet-5-5
            max_tokens: 4096
          crm:
            provider: anthropic
            model: claude-sonnet-5-5
            max_tokens: 4096
          support:
            provider: anthropic
            model: claude-sonnet-5-5
            max_tokens: 2048
          vision:
            provider: anthropic
            model: claude-sonnet-5-5
            max_tokens: 4096
          # embedding: not overridden — stays on the global DeepInfra model.
        notes: "MADFAM tenant routes to Anthropic only under a provider credit grant; DeepInfra is the fallback."

    # ── External service accounts ─────────────────────────────────────────
    services:
      resend:
        provider: resend
        service_type: email
        api_key_env: RESEND_API_KEY
        plan: pro
        plan_details: "Transactional Pro $20/mo (50K emails, 10 domains, no daily limit). Marketing Free (1K contacts)."
        payment_method: credit_card
        capacity:
          emails_per_month: 50000
          domains: 10
          rate_limit_per_second: 10
        consumption_tracking: true
        status: active
        notes: "Upgraded 2026-04-16. Full-access key: madfam-full-access. Domains: madfam.io (verified), selva.town, karafiel.mx, dhan.am, tezca.mx, forj.design, cotiza.studio, fortuna.tube, yantra4d.com. Account: innovacionesmadfam@proton.me."

      anthropic:
        provider: anthropic
        service_type: llm
        api_key_env: ANTHROPIC_API_KEY
        plan: pay_as_you_go
        plan_details: "Pay-per-token. Fable 5.1, Opus 5.5, Sonnet 5.5, Haiku 5.5 available."
        payment_method: credit_card
        capacity:
          models:
            - claude-fable-5-1
            - claude-opus-5-5
            - claude-sonnet-5-5
            - claude-haiku-5-5
        consumption_tracking: true
        status: active
        notes: "Usable ONLY under a provider credit grant (PROVIDER_GRANTS_REQUIRED_FOR=anthropic): no valid, unexpired, unexhausted grant for the request's org means Anthropic is unavailable for that call. Routed for the madfam tenant only (org_overrides.madfam); every other tenant stays on DeepInfra."

      deepinfra:
        provider: deepinfra
        service_type: llm
        api_key_env: DEEPINFRA_API_KEY
        plan: pay_as_you_go
        plan_details: "Pay-per-token. $0.23/$0.40 per 1M tokens (input/output) for Llama 3.3 70B."
        payment_method: credit_card
        capacity:
          models:
            - meta-llama/Llama-3.3-70B-Instruct
            - BAAI/bge-base-en-v1.5
        consumption_tracking: true
        status: active
        notes: "Only funded Selva LLM provider right now. Primary route for chat, vision, and embeddings."

      stripe:
        provider: stripe
        service_type: billing
        api_key_env: STRIPE_MX_SECRET_KEY
        plan: standard
        plan_details: "Stripe Mexico (MXN). 6 products, 15 MXN prices synced."
        payment_method: linked_to_dhanam
        capacity:
          products: 6
          prices: 15
        consumption_tracking: false
        status: active
        notes: "Managed via Dhanam. Checkout allowlist: 9 ecosystem domains."

      phyndcrm:
        provider: phyndcrm
        service_type: crm
        api_key_env: PHYND_CRM_FEDERATION_TOKEN
        plan: self_hosted
        plan_details: "Self-hosted PhyndCRM on K3s. Federation token auth."
        payment_method: none
        capacity:
          contacts: unlimited
          leads: unlimited
          pipelines: 2
        consumption_tracking: false
        status: active
        notes: "8 contacts, 8 leads, 2 pipelines seeded."

      janua:
        provider: janua
        service_type: auth
        api_key_env: JANUA_SECRET_KEY
        plan: self_hosted
        plan_details: "Self-hosted Janua SSO on K3s. OIDC + JWT."
        payment_method: none
        capacity:
          oauth_clients: unlimited
          users: unlimited
        consumption_tracking: false
        status: active
        notes: "23 OAuth clients registered. Handles all ecosystem auth."

      cloudflare:
        provider: cloudflare
        service_type: infrastructure
        api_key_env: CLOUDFLARE_API_TOKEN
        plan: free
        plan_details: "Free plan. Tunnel-based ingress, DNS management."
        payment_method: none
        capacity:
          domains: 16
          tunnels: 2
        consumption_tracking: false
        status: active
        notes: "All ecosystem domains managed via Cloudflare DNS + Tunnel."

      porkbun:
        provider: porkbun
        service_type: registrar
        api_key_env: PORKBUN_API_KEY
        secret_key_env: PORKBUN_SECRET_KEY
        plan: registrar_account
        plan_details: "MADFAM registrar account for domain inventory, nameserver delegation, DNS fallback, and renewal checks."
        payment_method: credit_card
        capacity:
          domains: 45
          nameserver_updates: enabled
          dns_records: enabled
        consumption_tracking: false
        status: active
        notes: "Selva DNS tools require both PORKBUN_API_KEY and PORKBUN_SECRET_KEY from selva-secrets. Routine registrar operations should go through Enclii when the Porkbun provider adapter is wired; direct API use is break-glass."

      enclii:
        provider: enclii
        service_type: devops
        api_key_env: ENCLII_API_TOKEN
        plan: self_hosted
        plan_details: "Self-hosted Enclii DevOps on K3s. ArgoCD GitOps."
        payment_method: none
        capacity:
          services: 50
          namespaces: 22
        consumption_tracking: false
        status: active
        notes: "3-node K3s cluster. All ecosystem services deployed via ArgoCD."

    # ── Org knowledge (injected into agent system prompts) ────────────────
    knowledge:
      - topic: email_infrastructure
        fact: "MADFAM uses Resend for email delivery. Transactional Pro plan ($20/mo, 50K emails/mo, 10 domains). Marketing is on the free tier (1K contacts). Credit card linked. Account: innovacionesmadfam@proton.me."
      - topic: verified_domains
        fact: "Verified sender domains: madfam.io, janua.dev. Pending: selva.town, karafiel.mx, dhan.am, tezca.mx, forj.design, cotiza.studio, fortuna.tube, yantra4d.com."
      - topic: llm_providers
        fact: "Primary LLM: DeepInfra for planning, coding, review, research, CRM, support, vision, and embeddings for every tenant. MADFAM's own tenant routes planning/coding/review/research to Claude Opus 5.5 and fast_coding/CRM/support/vision to Claude Sonnet 5.5 only while a provider credit grant is valid, falling back to DeepInfra. All ecosystem inference centralized through Selva nexus-api /v1 proxy."
      - topic: billing_infrastructure
        fact: "Stripe Mexico (MXN) via Dhanam. 6 products, 15 prices. Checkout domains: selva.town, karafiel.mx, tezca.mx, fortuna.tube, forgesight.quest, avala.studio, cotiza.studio, forj.design, yantra4d.com."

    # ── Embedding config ──────────────────────────────────────────────────
    embedding_provider: deepinfra
    embedding_model: BAAI/bge-base-en-v1.5
