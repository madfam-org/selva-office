# ═══════════════════════════════════════════════════════════════════════
# Per-tenant inference policy — mounted at /etc/selva/tenant-policies.yaml
# ═══════════════════════════════════════════════════════════════════════
# Read by madfam_inference.tenant_policy.load_tenant_policies() via
# TENANT_POLICY_PATH. This is the SERVER-SIDE floor: it holds even if a
# consumer drops or mangles its X-Sensitivity header.
#
# Onboarding a regulated tenant is a change to THIS FILE plus a rollout —
# never a code change. Adding a tenant here only ever TIGHTENS what that
# tenant can do; a tenant with no entry keeps the gateway defaults.
#
# After any edit: restart the inference-gateway pods and confirm the
# startup log line `tenant policy: loaded N tenant(s) …` names the tenant
# you expect. A parse failure logs at ERROR and leaves NO floors in
# force — never assume a floor is applied without reading that line.
# ═══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: selva-tenant-policies
  namespace: selva
  labels:
    app.kubernetes.io/name: tenant-policies
    app.kubernetes.io/part-of: selva-office
data:
  tenant-policies.yaml: |
    # ── Gateway-wide defaults (apply to every tenant without an entry) ──
    # 45 s matches the deadline the consuming app sets
    # (AbortSignal.timeout(45_000)), so the server deadline and the client
    # deadline agree instead of one silently outliving the other.
    default_request_timeout_seconds: 45
    default_max_tokens_cap: 4096

    tenants:
      # ── A vCTO client tenant under a data-processing contract ─────
      # Org id issued by Janua; sent by the tenant's app as
      # X-Selva-Tenant-Org. The tenant's contract keeps inference inside
      # the processor chain, hence the restricted floor. Which client this
      # is lives in the private operations repo, not here.
      e6cbd51d-8329-4c4e-8c74-aba643ab4575:
        display_name: vCTO client (restricted)
        # The load-bearing line. Even a request arriving as `public` is
        # served as `restricted`, i.e. local-model only. There is no
        # code path that can lower this.
        sensitivity_floor: restricted
        # The tenant's two AI surfaces today map to these task types.
        # Anything else is a 400 — a new surface must be added here
        # deliberately.
        allowed_task_types:
          - summarization
          - family-feedback
        # These outputs are short notes. Capping output bounds both cost
        # and the time a person waits.
        max_tokens_cap: 1500
        # Server deadline, below the 45 s client budget so the gateway
        # answers with a clean 504 before the client aborts.
        request_timeout_seconds: 40
        # Runaway brake, PER GATEWAY REPLICA (the limiter is in-process).
        # With 2 replicas the real ceiling is 60/min. Sized well above
        # a plausible human workload (a handful of suggestions per
        # session) and well below anything that could run up a bill.
        rate_limit_per_minute: 30
        # Informational daily budget for cost attribution and operator
        # review. Enforcement lands when BUDGET_GATE_ENABLED is armed
        # with Redis; until then this is the number to alert on from the
        # inference_usage_ledger.
        daily_usd_budget: 2.0
        notes: >-
          Tier restringido para un cliente vCTO con contrato de encargado.
          No se persiste prompt ni respuesta. Ver docs/DATA_CONTRACT_RESTRICTED.md;
          el runbook del operador vive en el repositorio privado de operaciones.

        # ── The ONE exception to the floor above ──────────────────────
        # WHAT: `family-feedback` drafts may be served by Anthropic (primary)
        #   or OpenAI (fallback) and by NO other provider, but only for a
        #   request that carries ALL of:
        #     X-Task-Type: family-feedback
        #     X-Sensitivity: internal          (exactly; not public, not more)
        #     X-Pseudonymized: true            (the client's attestation)
        #   Everything else from this tenant keeps the restricted floor,
        #   i.e. local model only: `summarization`, any other task, any
        #   request without the attestation, and any request that declares
        #   restricted or confidential. On an excepted request the gateway
        #   also refuses (400 direct_identifier_detected, nothing logged but
        #   the kind) any email, phone number, CURP, RFC or non-text content.
        #   The output cap, deadline, rate limit and budget above still
        #   apply, and nothing is persisted but the usage-ledger metadata.
        # WHY: the client, as data controller, authorized name-free
        #   (pseudonymized) drafting of this task by these two providers
        #   only. Its app strips every name before calling, refuses to send
        #   if a known name remains, and re-inserts names locally. Owner
        #   decision recorded 2026-10-07. Before enabling, the owner confirms
        #   each provider's API data terms (see docs/DATA_CONTRACT_RESTRICTED.md
        #   section 6).
        # TO TURN IT OFF: delete the whole `task_exceptions:` block below and
        #   roll the gateway (restart the inference-gateway pods). Every
        #   family-feedback request then gets the restricted floor again; the
        #   client sees 503s (or local-model drafts once a local backend
        #   exists) and nothing reaches a cloud provider. To drop just one
        #   provider, remove it from `allowed_providers` AND from `models`.
        # An invalid block logs an ERROR at startup and is NOT applied (the
        # floor stays). After a rollout, confirm the startup line
        # `tenant policy: <org> task exception in force: task_type=family-feedback ...`
        # — or, after turning it off, that the line is gone.
        task_exceptions:
          family-feedback:
            sensitivity_floor: internal
            # Order matters: first = primary, the rest = fallback, in order.
            allowed_providers: [anthropic, openai]
            requires_header: "X-Pseudonymized: true"
            # anthropic: the current Sonnet, priced in
            #   madfam_budget_gate.cost_model ($2 / $10 per 1M tokens). It
            #   rejects a non-default temperature, so the Anthropic adapter
            #   leaves temperature out for it.
            # openai: gpt-4o, the newest OpenAI model Selva both prices and
            #   can call (o1 / o1-mini are priced but reject the adapter's
            #   max_tokens and temperature; gpt-4o-mini is the smaller tier
            #   of the same generation).
            models:
              anthropic: claude-sonnet-5-5
              openai: gpt-4o
            authorized_on: 2026-10-07
            notes: >-
              Excepción de redacción seudonimizada autorizada por el cliente
              (responsable de los datos). Sólo esta tarea, sólo estos dos
              proveedores. Ver docs/DATA_CONTRACT_RESTRICTED.md, sección 6.
