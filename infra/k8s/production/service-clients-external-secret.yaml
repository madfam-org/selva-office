# Janua machine-edge client credentials for the workers' phygital tools.
#
# Yantra4D accepts short-lived Janua client_credentials tokens, so the workers
# hold the confidential client's id and secret and mint tokens at run time
# (packages/tools/src/selva_tools/builtins/service_auth.py). No human types or
# sees either value: `enclii secrets provision oidc --platform selva-yantra4d`
# creates or rotates the Janua client and merges the pair into secret/selva
# through the enclii intake target `selva/yantra4d-client`. The LOWERCASE
# properties below must match that target's keys byte for byte; ESO syncs all of
# an ExternalSecret's keys or none.
#
# A DEDICATED Secret, so this ExternalSecret owns nothing else: an Owner
# ExternalSecret over an existing Secret deletes every key it does not produce.
# The workers read it through `envFrom` with optional: true, so they start
# before the first sync and fall back to the static-token variables (and then
# fail closed) until the pair exists. A machine edge added later adds its pair
# here and needs no other manifest change.
#
# The Pravara-MES pair comes the same way from `enclii secrets provision oidc
# --platform selva-pravara-mes-madfam-ecosystem` through `selva/pravara-mes-client`
# (org-bound to madfam-ecosystem, since Pravara needs tenant_id).
#
# Order: provision BOTH clients first, then let this sync (all keys or none). Before the properties
# exist in secret/selva this ExternalSecret reports SecretSyncedError; nothing
# else is affected. Re-running the provision command rotates the secret, and
# the workers' Reloader annotation rolls them onto the new value.
#
# Staging deletes this ExternalSecret (overlays/staging/
# patch-delete-service-clients-externalsecret.yaml): production machine
# credentials never sync into selva-staging.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-service-clients
  namespace: selva
  labels:
    app.kubernetes.io/name: workers
    app.kubernetes.io/part-of: selva-office
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: selva-service-clients
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Machine edge selva-yantra4d: scope yantra4d:render, audience yantra4d-api.
    - secretKey: SELVA_YANTRA4D_CLIENT_ID
      remoteRef:
        key: secret/selva
        property: yantra4d_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SELVA_YANTRA4D_CLIENT_SECRET
      remoteRef:
        key: secret/selva
        property: yantra4d_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Machine edge selva-pravara-mes-madfam-ecosystem: scope pravara-mes:read,
    # audience pravara-api, org-bound to madfam-ecosystem.
    - secretKey: SELVA_PRAVARA_CLIENT_ID
      remoteRef:
        key: secret/selva
        property: pravara_mes_client_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SELVA_PRAVARA_CLIENT_SECRET
      remoteRef:
        key: secret/selva
        property: pravara_mes_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
