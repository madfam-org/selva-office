# Staging must never copy the production grant or its key (Vault secret/selva)
# into selva-staging. Staging keeps its own optional ANTHROPIC_API_KEY from
# selva-staging-llm-secrets (patch-nexus-api / patch-workers); the grants
# volume stays optional and empty, so a grant-guarded provider is simply
# unavailable there.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-provider-grants
$patch: delete
