# PP.4 (RFC 0001 Phase 2) — selva-office staging overlay.
#
# Imports the production canonical base and applies staging-specific
# patches. Mirrors Karafiel's PP.1 pilot + Dhanam's PP.2b pattern,
# scaled to 6 Deployments (nexus-api, office-ui, colyseus, admin,
# gateway, workers) + 3 HPAs.
#
# Namespace choice: `selva-staging` matches the ecosystem convention
# (karafiel-staging, dhanam-staging) and keeps the staging tier aligned
# with the Selva production namespace.
#
# What staging differs from prod on:
#   - namespace: selva-staging
#   - replicas: 1 per deploy (HPAs pinned to maxReplicas=1 via patch)
#   - image digests: updated by staging-deploy.yml on every main merge
#   - env: ENVIRONMENT=staging, SENTRY_ENVIRONMENT=staging, AUTO_DISPATCH_ENABLED=false
#   - secrets: selva-staging-{secrets,llm-secrets,admin-auth}
#   - feature flags: voice-mode live sends off, Stripe live off,
#     Reddit bot off, autonomous dispatch off
#   - Cloudflare DNS + tunnel routes for staging-*.selva.town are
#     ops-managed (see docs/PP_4_STAGING_AUDIT.md § recommended ordering).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: selva-staging

resources:
  - namespace.yaml
  - ../../production

# Staging replicas: 1 everywhere. HPAs are pinned min=max=1 via
# hpa-disable-patch.yaml — the deployments ignore HPA when at max.
replicas:
  - name: nexus-api
    count: 1
  - name: office-ui
    count: 1
  - name: colyseus
    count: 1
  - name: admin
    count: 1
  - name: gateway
    count: 1
  - name: workers
    count: 1

# Image digests for staging. CI (staging-deploy.yml) updates these on
# every main-branch push via a Python regex patch. The placeholder
# digest below will be overwritten by the first staging deploy.
images:
  - name: ghcr.io/madfam-org/selva-nexus-api
    digest: sha256:98dafdc9ff6fea292eb31b977837d2f61667aeb24233eaa23108eba09e35ba52
  - name: ghcr.io/madfam-org/selva-office-ui
    digest: sha256:9fdb7fae74ec14ef73b922ebc31f39fa7e6c81624bb957d75c3d5d616d0c4869
  - name: ghcr.io/madfam-org/selva-colyseus
    digest: sha256:253e088b401e8302d913b2abf05f99db81b18f6715586513e0c57aae68bafc93
  - name: ghcr.io/madfam-org/selva-admin
    digest: sha256:cfd455cdcf7b251410944284720049c46a6f40308d5ecf09f6fac1b590f21071
  - name: ghcr.io/madfam-org/selva-gateway
    digest: sha256:b167ed672f80083fab5d1013688ccb3e80be35db02a20c4269da53b09d7132a8
  - name: ghcr.io/madfam-org/selva-workers
    digest: sha256:da995add82ec2ccc25592162463d9b01d986098dcd17cfa9ea73f6134934107e

# Per-deployment strategic-merge-patches. Each file is a single-doc
# patch with explicit `metadata.name` so kustomize's patch matcher
# resolves cleanly (vs multi-doc files which trip up the name lookup
# when namespace is rewritten by the overlay).
patches:
  - path: patch-delete-storageclass.yaml
    target:
      kind: StorageClass
      name: longhorn-selva-backup
  - path: patch-delete-backup-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: postgres-backup-pvc
  - path: patch-delete-backup-cronjob.yaml
    target:
      kind: CronJob
      name: postgres-backup
  - path: patch-delete-backup-externalsecret.yaml
    target:
      kind: ExternalSecret
      name: postgres-backup-credentials
  - path: patch-delete-provider-grants-externalsecret.yaml
    target:
      kind: ExternalSecret
      name: selva-provider-grants
  - path: patch-delete-inference-gateway.yaml
    target:
      kind: Deployment
      name: inference-gateway
  - path: patch-delete-inference-gateway-svc.yaml
    target:
      kind: Service
      name: inference-gateway
  - path: patch-nexus-api.yaml
    target:
      kind: Deployment
      name: nexus-api
  - path: patch-migrate-job.yaml
    target:
      kind: Job
      name: nexus-api-migrate
  - path: patch-office-ui.yaml
    target:
      kind: Deployment
      name: office-ui
  - path: patch-colyseus.yaml
    target:
      kind: Deployment
      name: colyseus
  - path: patch-admin.yaml
    target:
      kind: Deployment
      name: admin
  - path: patch-gateway.yaml
    target:
      kind: Deployment
      name: gateway
  - path: patch-workers.yaml
    target:
      kind: Deployment
      name: workers

  # HPAs pinned to maxReplicas=1 in staging — single replica is fine
  # and autoscaling would just mask deploy issues.
  - path: hpa-disable-patch.yaml
    target:
      kind: HorizontalPodAutoscaler

  # KEDA workers scaler pinned to 1 — RWO memory PVC cannot multi-attach.
  - path: patch-keda-staging.yaml
    target:
      kind: ScaledObject
      name: workers-keda

# `labels:` replaces the deprecated `commonLabels:`. Adds an
# environment tag so Grafana/Prometheus can slice dashboards by tier.
labels:
  - pairs:
      selva.town/environment: staging
    includeSelectors: false
