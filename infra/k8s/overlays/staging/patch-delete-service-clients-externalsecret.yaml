# The production base syncs Selva's Janua machine-edge client credentials from
# secret/selva (production). Staging must never hold them, so the
# ExternalSecret is removed from the staging render; staging workers fall back
# to the static-token variables and fail closed without one.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: selva-service-clients
$patch: delete
