  - repo: selva-office
    path: packages/tools/src/selva_tools/builtins/factory_manifest.py
  acceptance:
  - Valid JSON Schema; every build-shape key and every known Routecraft key is mapped or dropped with
    a reason.
  - Prices only as catalog references, never amounts.
  - Consent/data-classification section present.
